webconfig {
    security {
        encryption_key_env_name = "WEBCONFIG_KEY"
    }

    app_name = "webconfig"
    panic_exit_enabled = false
    factory_reset_enabled = false
    tracing {
        moracide_tag_prefix = "X-Cl-Experiment"
        otel {
            enabled = false
            endpoint = "127.0.0.1:4318"
            operation_name = "http.request"
            // Allowed values: "noop", "stdout", "http"
            // "noop" will generate no trace
            // "stdout" will use stdoutTracer and output spans to stdout
            // "http" will use otlphttpTracer and output spans that need to be collected by otelcollector
            provider = "noop"
        }
    }

    // build info
    code_git_commit = "oswebconfig-25.2.2.3-249.cea2264"
    build_time = "2025-02-24_18:50:55_UTC"
    token_api_enabled = true

    server {
        port = 9007
        localhost_only = false
        read_timeout_in_secs = 5
        write_timeout_in_secs = 50
        metrics_enabled = true
        max_request_body_in_bytes = 1048576
    }

    log {
        level = "info"
        file = "/tmp/webconfig.log"
        sarama_logger_enabled = false
        // List of request header names to suppress from logs (case-insensitive)
        ignored_headers = []
    }

    metrics {
        log_level = "trace"
        watched_cpes = []
    }

    webpa {
        retries = 3
        retry_in_msecs = 100
        connect_timeout_in_secs = 10
        read_timeout_in_secs = 142
        max_idle_conns_per_host = 100
        keepalive_timeout_in_secs = 30
        host = "http://localhost:12345"
        async_poke_enabled = false
        async_poke_concurrent_calls = 100
        api_version = "v2"
        url_template = "%s/%s/%s"
    }

    xconf {
        retries = 3
        retry_in_msecs = 100
        connect_timeout_in_secs = 4
        read_timeout_in_secs = 141
        max_idle_conns_per_host = 100
        max_conns_per_host = 100
        keepalive_timeout_in_secs = 30
        host = "http://localhost:12346"
        url_template = "%s/%s"
    }

    mqtt {
        retries = 3
        retry_in_msecs = 100
        connect_timeout_in_secs = 4
        read_timeout_in_secs = 141
        max_idle_conns_per_host = 100
        max_conns_per_host = 100
        keepalive_timeout_in_secs = 30
        host = "http://localhost:12347"
        url_template = "%s/%s"
    }

    upstream {
        enabled = false
        retries = 3
        retry_in_msecs = 100
        connect_timeout_in_secs = 4
        read_timeout_in_secs = 141
        max_idle_conns_per_host = 100
        max_conns_per_host = 100
        keepalive_timeout_in_secs = 30
        host = "http://localhost:12348"
        url_template = "%s/%s"
        profile_url_template = "%s/%s/%s"
    }

    http_client {
        cert_file = "/tmp/cert.pem"
        private_key_file = "/tmp/cert.pem"
        // Optional CA bundle used to verify upstream server certificates.
        // If unset, the system root CA pool is used.
        ca_cert_file = ""
        // Defaults to false. Setting this to true disables server certificate
        // verification for all outbound HTTPS connectors and is insecure.
        tls_insecure_skip_verify = false
        // Optional User-Agent header sent on all outbound HTTP requests.
        user_agent = ""
    }

    jwt {
        // when this config is false, the server does not try to read these files
        enabled = false

        // north bound APIs from orc/customers, no mac embedded in tokens
        api_token {
            kids = [
                "sat-prod-k1-1024",
            ]
            capabilities = [
                "webconfig:all",
            ]
            jwks_enabled = false
            jwks_url = ""
            jwks_refresh_in_secs = 86400
        }

        // south bound APIs from CPEs, macs embedded in tokens
        cpe_token {
            kids = [
                "webconfig_key",
            ]
        }

        // list of supported key IDs and their private/public key files
        kid {
            webconfig_key {
                public_key_file = /tmp/webconfig_key_pub.pem
                private_key_file = /tmp/webconfig_key.pem
            }

            themis-201701 {
                public_key_file = /tmp/sat-themis-201701.pub
            }

            sat-prod-k1-1024 {
                public_key_file = /tmp/sat-prod-k1-1024.pub
            }
        }

        server_api_token_auth {
            enabled = true
        }
        device_api_token_auth {
            enabled = true
        }
    }

    database {
        active_driver = "cassandra"
        sqlite {
            db_file = "/app/data/rdkwebconfig/db_rdkwebconfig.sqlite"
            unittest_db_file = "/tmp/test_webconfig.sqlite"
            concurrent_queries = 5
        }
        cassandra {
            encrypted_password = ""
            hosts = [
                "127.0.0.1"
            ]
            keyspace = "webconfig"
            timeout_in_sec = 5
            connect_timeout_in_sec = 5
            concurrent_queries = 5
            connections = 5
            local_dc = ""
            page_size = 50
            user = "dbuser"
            test_keyspace = "test_webconfig"
            is_ssl_enabled = true

            // TLS/SSL configuration (optional when is_ssl_enabled = true)
            // Client certificate for mutual TLS (mTLS) - optional
            tls_cert_file = "/path/to/client-cert.pem"
            tls_key_file = "/path/to/client-key.pem"

            // CA certificate for server verification - optional
            tls_ca_cert_file = "/path/to/ca-cert.pem"

            // Skip certificate verification (INSECURE - for testing only)
            // When true, allows TLS without certificates or CA validation
            tls_insecure_skip_verify = false

            // Override SNI hostname sent during TLS handshake.
            // Required when the certificate uses DNS SANs only (no IP SANs).
            // Leave empty to use the host IP address (gocql default).
            tls_server_name = ""
        }

        yugabyte {
            encrypted_password = ""
            hosts = [
                "192.168.1.114"
            ]
            keyspace = "yugabytedb"
            timeout_in_sec = 5
            connect_timeout_in_sec = 5
            concurrent_queries = 5
            connections = 5
            local_dc = ""
            page_size = 50
            user = "dbuser"
            test_keyspace = "test_yugabytedb"

            // TODO change to false for CI/CD
            is_ssl_enabled = true

            // TLS/SSL configuration (optional when is_ssl_enabled = true)
            // Client certificate for mutual TLS (mTLS) - optional
            tls_cert_file = "/path/to/client-cert.pem"
            tls_key_file = "/path/to/client-key.pem"

            // CA certificate for server verification - optional
            tls_ca_cert_file = "/path/to/ca-cert.pem"

            // Skip certificate verification (INSECURE - for testing only)
            // When true, allows TLS without certificates or CA validation
            tls_insecure_skip_verify = false

            // Override SNI hostname sent during TLS handshake.
            // Required when the certificate uses DNS SANs only (no IP SANs).
            // Leave empty to use the host IP address (gocql default).
            tls_server_name = ""
        }
    }

    kafka {
        enabled = false
        brokers = "localhost:9092"
        topics = "config-version-report,staging-chi-onewifi-from-device"
        use_random_consumer_group = false
        consumer_group = "webconfig"
        assignor = "roundrobin"
        oldest = false
        newest = false
        ratelimit {
            messages_per_second = 10
        }

        // TLS configuration for secure Kafka connections
        // NOTE: These are flat keys read by LoadKafkaTLSConfig at prefix "webconfig.kafka"
        // Certificate files (tls_cert_file, tls_key_file, tls_ca_cert_file) are REQUIRED when
        // tls_insecure_skip_verify=false (default). They are OPTIONAL when tls_insecure_skip_verify=true.
        tls_enabled = false
        tls_cert_file = "/etc/webconfig/kafka/client-cert.pem"
        tls_key_file = "/etc/webconfig/kafka/client-key.pem"
        tls_ca_cert_file = "/etc/webconfig/kafka/ca-cert.pem"
        // WARNING: set true only in dev/test environments, NEVER in production
        tls_insecure_skip_verify = false

        // Reconnect resilience — tuned for broker restart recovery.

        // metadata.retry_max: max metadata fetch retries before giving up.
        //   lib default: 3  |  configured: 10
        //   Extends the retry window to 10×2s = 20s, covering the cluster
        //   stabilisation window during leader election after a broker restart.
        metadata.retry_max = 10

        // metadata.retry_backoff_sec: seconds between metadata fetch retries.
        //   lib default: 0.25s  |  configured: 2s
        //   Prevents rapid-fire retries against a restarting broker; gives the
        //   cluster time to stabilise between attempts.
        metadata.retry_backoff_sec = 2

        // metadata.refresh_frequency_sec: background metadata refresh interval in seconds.
        //   lib default: 600s (10min)  |  configured: 300s (5min)
        //   Proactive background refresh catches stale partition leaders up to 5min
        //   sooner than the library default after a broker restart.
        metadata.refresh_frequency_sec = 300

        // consumer.session_timeout_sec: consumer group session timeout in seconds.
        //   lib default: 10s  |  configured: 30s
        //   Must be within broker group.min.session.timeout.ms (6s) /
        //   group.max.session.timeout.ms (300s). 30s gives the consumer group
        //   time to survive a restarting group coordinator without triggering
        //   an unnecessary rebalance.
        //   Heartbeat interval is derived as session_timeout_sec / 6 (= 5s for
        //   the default 30s). The Kafka protocol ceiling is session_timeout / 3
        //   (10s); using /6 gives double the margin against transient jitter.
        //   lib heartbeat default: 3s  |  configured: 5s
        consumer.session_timeout_sec = 30

        // consumer.retry_backoff_sec: seconds a partition reader waits before retrying a failed fetch.
        //   lib default: 2s  |  configured: 2s
        //   Set explicitly to make the value visible and tunable.
        consumer.retry_backoff_sec = 2

        // net.timeout_sec: dial/read/write timeout for broker connections in seconds.
        //   lib default: 30s  |  configured: 10s
        //   Tighter timeout lets the retry loop engage within 10s per attempt
        //   instead of blocking for 30s (fail-fast on broken broker connections).
        net.timeout_sec = 10

        // if we want to use more than 1 cluster
        clusters {
            mesh {
                enabled = false
                brokers = "localhost:19093"
                topics = "config-version-report,staging-chi-onewifi-from-device"
                use_random_consumer_group = false
                consumer_group = "webconfig"
                assignor = "roundrobin"
                oldest = false
                newest = false
                ratelimit {
                    messages_per_second = 10
                }

                // TLS configuration for mesh cluster (flat keys at prefix "webconfig.kafka.clusters.mesh")
                tls_enabled = false
                tls_cert_file = "/etc/webconfig/kafka/mesh-client-cert.pem"
                tls_key_file = "/etc/webconfig/kafka/mesh-client-key.pem"
                tls_ca_cert_file = "/etc/webconfig/kafka/mesh-ca-cert.pem"
                tls_insecure_skip_verify = false
            }
            east {
                enabled = false
                brokers = "localhost:19094"
                topics = "config-version-report,staging-chi-onewifi-from-device"
                use_random_consumer_group = false
                consumer_group = "webconfig"
                assignor = "roundrobin"
                oldest = false
                newest = false
                ratelimit {
                    messages_per_second = 10
                }

                // TLS configuration for east cluster (flat keys at prefix "webconfig.kafka.clusters.east")
                tls_enabled = false
                tls_cert_file = "/etc/webconfig/kafka/east-client-cert.pem"
                tls_key_file = "/etc/webconfig/kafka/east-client-key.pem"
                tls_ca_cert_file = "/etc/webconfig/kafka/east-ca-cert.pem"
                tls_insecure_skip_verify = false
            }
        }
    }

    // blocked_subdoc_ids = ["portforwarding", "macbinding"]
    blocked_subdoc_ids = []
    encrypted_subdoc_ids = [ "privatessid", "homessid", "telcovoip", "voiceservice" ]

    validate_device_id_as_mac_address = false

    // if valid_partners is empty, then all partners are accepted
    // if valid partners is not empty, all parters NOT in the list will be stored as "unknown"
    valid_partners = ["company", "vendor1", "vendor2"]

    supplementary_appending_enabled = true

    // correct subdoc states if versions match but not "deployed"
    state_correction_enabled= false

    // pre-cook supplementary subdocs into the database
    supplementary_precook_enabled = false
    // number of days to retain supplementary precook state (default 7)
    supplementary_precook_state_ttl_days = 7

    // forward kafka messages if needed
    kafka_producer {
        enabled = false
        brokers = "localhost:9092"
        topic = "webconfig_downstream"

        // TLS configuration for Kafka producer (flat keys at prefix "webconfig.kafka_producer")
        tls_enabled = false
        tls_cert_file = "/etc/webconfig/kafka/producer-client-cert.pem"
        tls_key_file = "/etc/webconfig/kafka/producer-client-key.pem"
        tls_ca_cert_file = "/etc/webconfig/kafka/producer-ca-cert.pem"
        tls_insecure_skip_verify = false

        // Reconnect resilience — tuned for broker restart recovery.

        // metadata.retry_max: max metadata fetch retries before giving up.
        //   lib default: 3  |  configured: 10
        //   Extends the retry window to 10×2s = 20s, covering the cluster
        //   stabilisation window during leader election after a broker restart.
        metadata.retry_max = 10

        // metadata.retry_backoff_sec: seconds between metadata fetch retries.
        //   lib default: 0.25s  |  configured: 2s
        //   Prevents rapid-fire retries against a restarting broker.
        metadata.retry_backoff_sec = 2

        // metadata.refresh_frequency_sec: background metadata refresh interval in seconds.
        //   lib default: 600s (10min)  |  configured: 300s (5min)
        //   Proactive background refresh catches stale partition leaders up to 5min
        //   sooner than the library default after a broker restart.
        metadata.refresh_frequency_sec = 300

        // producer.retry_max: max internal send retries before a message is put on the error channel.
        //   lib default: 3  |  configured: 10
        //   Mirrors metadata.retry_max — gives the producer the same tolerance for
        //   transient broker unavailability as the consumer has for metadata fetches.
        producer.retry_max = 10

        // producer.retry_backoff_sec: seconds between internal send retries.
        //   lib default: 0.1s  |  configured: 2s
        //   Matches metadata.retry_backoff_sec cadence; avoids hammering a restarting broker.
        producer.retry_backoff_sec = 2

        // net.timeout_sec: dial/read/write timeout for broker connections in seconds.
        //   lib default: 30s  |  configured: 10s
        //   Tighter timeout lets the retry loop engage within 10s per attempt
        //   instead of blocking for 30s (fail-fast on broken broker connections).
        net.timeout_sec = 10
    }

    // this allows the root document locked if needed
    lock_root_document_enabled = false

    // get extra profiles from upstream
    upstream_profiles_enabled = false

    // only valid query_params formats are accepted
    query_params_validation_enabled = false

    // only devices using tokens with trust higher or equal can GET the full document
    min_trust = 0

    // subdoc ids accepted by the validator even if they are without bitmap definition
    valid_subdoc_ids = []

    filter_output_by_bitmap_enabled = false

    bitmap_filter_exempt_subdoc_ids = []

    // return an empty profile document when no upstream data is available
    default_empty_profile_enabled = false
}
